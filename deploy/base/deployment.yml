apiVersion: apps/v1
kind: Deployment
metadata:
  name: manejo-finanzas-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manejo-finanzas-mcp
  template:
    metadata:
      labels:
        app: manejo-finanzas-mcp
    spec:
      containers:
        - name: mcp-server
          image: aflobaton/manejo-finanzas-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: env-file
              mountPath: /var/www/html/.env
              subPath: .env
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: env-file
          secret:
            secretName: manejo-finanzas-secrets
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manejo-finanzas-mcp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: manejo-finanzas-mcp
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80